name: Build SaveVido Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - savevido-central-platform
    paths:
      - "app.py"
      - "desktop_launcher.py"
      - "requirements-windows.txt"
      - "templates/**"
      - "static/**"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build SaveVido desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SaveVido --add-data "templates;templates" --add-data "static;static" --collect-all yt_dlp --collect-all gallery_dl --collect-all flask --collect-all werkzeug --hidden-import pystray._win32 desktop_launcher.py

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found in the downloaded archive." }
          New-Item -ItemType Directory -Force "dist\SaveVido\ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "dist\SaveVido\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "dist\SaveVido\ffmpeg\ffprobe.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 7\ISCC.exe")) {
              throw "Inno Setup compiler was not installed."
            }
          }

      - name: Prepare branded installer artwork
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path "installer\savevido-installer-logo.png"))
          $bitmap = New-Object System.Drawing.Bitmap 55,55
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::White)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($source, 0, 0, 55, 55)
          $bitmap.Save((Join-Path (Get-Location) "installer\savevido-installer-logo.bmp"), [System.Drawing.Imaging.ImageFormat]::Bmp)
          $graphics.Dispose(); $bitmap.Dispose(); $source.Dispose()

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files (x86)\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found." }
          & $compiler "installer\SaveVido.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "release\SaveVido-Setup.exe")) { throw "Installer output was not created." }

      - name: Publish permanent GitHub Release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload v1.0.0 "release/SaveVido-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v1.0.0 "release/SaveVido-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_REF_NAME" --title "SaveVido 1.0.0" --notes "Windows installer for SaveVido by AZAN KHAN. Requires Windows 10 or Windows 11. Installation and in-app download behavior should be tested on a supported PC."
          }
