name: Build SaveVido Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - savevido-central-platform
    paths:
      - "app.py"
      - "desktop_launcher.py"
      - "requirements-windows.txt"
      - "templates/**"
      - "static/**"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: savevido-windows-${{ github.ref }}
  # Queue newer commits instead of canceling an installer during compression.
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Verify Qt WebEngine imports
        shell: pwsh
        run: |
          python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebEngineCore import QWebEngineProfile; print('Qt WebEngine import check passed')"

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; im=Image.open('static/icon-512.png').convert('RGBA'); im.save('static/savevido.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build SaveVido desktop application
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          @{ version = $version } | ConvertTo-Json | Set-Content -Path "build_info.json" -Encoding utf8
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SaveVido --icon "static/savevido.ico" --add-data "templates;templates" --add-data "static;static" --add-data "build_info.json;." --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore --exclude-module tkinter --exclude-module _tkinter --exclude-module test --exclude-module unittest --exclude-module pydoc --collect-all yt_dlp --collect-all gallery_dl --collect-all flask --collect-all werkzeug --collect-all shiboken6 desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed with exit code $LASTEXITCODE." }
          $webEngineModule = Get-ChildItem "dist\SaveVido" -Filter "QtWebEngineWidgets*.pyd" -Recurse | Select-Object -First 1
          if (-not $webEngineModule) { throw "PySide6.QtWebEngineWidgets was not bundled. Refusing to create a broken installer." }
          Write-Host "Qt WebEngine Widgets module bundled: $($webEngineModule.FullName)"

      - name: Remove unused Qt QML payload before packaging
        shell: pwsh
        run: |
          $qmlDir = Join-Path $env:GITHUB_WORKSPACE "dist\\SaveVido\\_internal\\PySide6\\qml"
          if (Test-Path -LiteralPath $qmlDir) {
            Write-Host "Removing optional Qt QML modules not used by the Qt WebEngine Widgets desktop UI: $qmlDir"
            Remove-Item -LiteralPath $qmlDir -Recurse -Force
          }
          if (Test-Path -LiteralPath $qmlDir) { throw "Unused Qt QML payload could not be removed: $qmlDir" }

      - name: Remove unused Qt translation catalogs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE "dist\\SaveVido\\_internal\\PySide6"
          if (-not (Test-Path -LiteralPath $qtRoot -PathType Container)) {
            throw "Expected PySide6 runtime folder is missing: $qtRoot"
          }
          # The desktop UI ships in English. Qt translation catalogs are not
          # required to render the WebEngine interface or run the downloader.
          $translationDirs = Get-ChildItem -LiteralPath $qtRoot -Directory -Recurse -Force |
            Where-Object { $_.Name -eq "translations" } |
            Sort-Object { $_.FullName.Length } -Descending
          foreach ($dir in $translationDirs) {
            Write-Host "Removing optional Qt translation catalogs: $($dir.FullName)"
            Remove-Item -LiteralPath $dir.FullName -Recurse -Force
          }
          Write-Host ("Removed {0} optional Qt translation directory/directories." -f $translationDirs.Count)

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = $env:GITHUB_WORKSPACE
          $archive = Join-Path $env:RUNNER_TEMP "savevido-ffmpeg.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "savevido-ffmpeg-extracted"
          $appRoot = Join-Path $workspace "dist\SaveVido"
          $ffmpegDir = Join-Path $appRoot "ffmpeg"

          if (-not (Test-Path -LiteralPath $appRoot -PathType Container)) {
            throw "PyInstaller application folder is missing: $appRoot"
          }

          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "FFmpeg archive download did not create: $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force

          $ffmpeg = Get-ChildItem -LiteralPath $extractRoot -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $extractRoot -Filter "ffprobe.exe" -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg binaries were not found in the downloaded archive. Extracted to: $extractRoot"
          }

          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $ffmpegDir "ffmpeg.exe") -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $ffmpegDir "ffprobe.exe") -Force

          foreach ($binary in @("ffmpeg.exe", "ffprobe.exe")) {
            $target = Join-Path $ffmpegDir $binary
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "FFmpeg bundle copy failed; required file is missing: $target"
            }
            if ((Get-Item -LiteralPath $target).Length -le 0) {
              throw "FFmpeg bundle copy produced an empty file: $target"
            }
          }
          Write-Host "Verified FFmpeg bundle directory: $ffmpegDir"
          Get-ChildItem -LiteralPath $ffmpegDir -File | ForEach-Object {
            Write-Host ("{0:N1} MB | {1}" -f ($_.Length / 1MB), $_.Name)
          }

      - name: Report packaged component sizes
        shell: pwsh
        run: |
          $root = "dist\SaveVido"
          $total = (Get-ChildItem $root -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Total unpacked app size: {0:N1} MB" -f ($total / 1MB))
          Get-ChildItem $root -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -File -Recurse | Measure-Object -Property Length -Sum).Sum
            Write-Host ("{0}: {1:N1} MB" -f $_.Name, ($bytes / 1MB))
            if ($_.Name -eq "_internal") {
              Get-ChildItem $_.FullName -Directory | ForEach-Object {
                $childBytes = (Get-ChildItem $_.FullName -File -Recurse | Measure-Object -Property Length -Sum).Sum
                Write-Host ("  _internal/{0}: {1:N1} MB" -f $_.Name, ($childBytes / 1MB))
              }
            }
          }
          Write-Host "Largest bundled files:"
          Get-ChildItem $root -File -Recurse | Sort-Object Length -Descending | Select-Object -First 25 | ForEach-Object {
            Write-Host ("{0:N1} MB | {1}" -f ($_.Length / 1MB), $_.FullName)
          }
          Write-Host "Bundled FFmpeg sizes:"
          if (Test-Path "$root\ffmpeg") {
            Get-ChildItem "$root\ffmpeg" -File | ForEach-Object {
              Write-Host ("{0:N1} MB | {1}" -f ($_.Length / 1MB), $_.Name)
            }
          } else {
            throw "FFmpeg folder is missing after the bundle step."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 7\ISCC.exe")) {
              throw "Inno Setup compiler was not installed."
            }
          }

      - name: Prepare branded installer artwork
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; im=Image.open('static/icon-512.png').convert('RGB'); im.resize((55,55), Image.Resampling.LANCZOS).save('installer/savevido-installer-logo.bmp')"

      - name: Compile installer
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $releaseDir = Join-Path $root "release"
          $distDir = Join-Path $root "dist\SaveVido"
          $issDir = Join-Path $root "installer"
          $issFile = Join-Path $issDir "SaveVido.iss"
          $iconFile = Join-Path $root "static\savevido.ico"
          $wizardImage = Join-Path $issDir "savevido-installer-logo.bmp"
          $appExe = Join-Path $distDir "SaveVido.exe"

          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          foreach ($required in @($distDir, $issFile, $iconFile, $wizardImage, $appExe)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required installer input is missing: $required"
            }
          }
          if (-not (Get-ChildItem -LiteralPath $distDir -Force)) {
            throw "PyInstaller output folder is empty: $distDir"
          }

          $compiler = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found in the standard Inno Setup locations." }

          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          Write-Host "Repository root: $root"
          Write-Host "Compiler: $compiler"
          Write-Host "Script: $issFile"
          Write-Host "Output: $(Join-Path $releaseDir 'SaveVido-Setup.exe')"
          Push-Location $issDir
          try {
            & $compiler "/DAppVersion=$version" "SaveVido.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          }
          finally {
            Pop-Location
          }

          $installer = Join-Path $releaseDir "SaveVido-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer output was not created: $installer" }
          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -lt 1000000) { throw "Installer output is unexpectedly small ($size bytes)." }
          Write-Host ("Installer compiled successfully: {0} ({1:N1} MB)" -f $installer, ($size / 1MB))

      - name: Publish versioned GitHub Release and refresh website manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          gh release create $tag "release/SaveVido-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SaveVido $version" --notes "SaveVido Windows installer. Requires Windows 10 or Windows 11. Verify compatibility on your PC before relying on it."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }

          $sha256 = (Get-FileHash "release/SaveVido-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          python -c "import json,sys,os; from datetime import datetime,timezone; p='platform/release-config.json'; d=json.load(open(p,encoding='utf-8')); v=sys.argv[1]; h=sys.argv[2]; d['current_version']=v; d['updated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z'); d['update_service']['status']='Latest Windows release published automatically from GitHub commits.'; w=d['channels']['windows']; w['version']=v; w['status']='Available: latest verified Windows installer.'; w['download_url']='https://github.com/'+os.getenv('GITHUB_REPOSITORY','AzanKhan-pk/conver-my-files-to-installer-and-apk-with-GPT')+'/releases/download/v'+v+'/SaveVido-Setup.exe'; w['sha256']=h; json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2); print('Website manifest updated:',v)" $version $sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/release-config.json
          git commit -m "chore: publish SaveVido $version release manifest"

          # Rebase the manifest commit onto the latest branch tip to avoid
          # rejecting the push when another workflow/user updated the branch.
          git fetch origin "$env:GITHUB_REF_NAME"
          git rebase "origin/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Manifest rebase failed; refusing to force-push or overwrite remote changes." }

          git push origin "HEAD:$env:GITHUB_REF_NAME"
