
name: SaveVido source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade "yt-dlp[default]"

      - name: Verify yt-dlp
        run: |
          python -m yt_dlp --version
          python -m yt_dlp --list-extractors

      - name: Compile Python files
        run: python -m py_compile app.py desktop_launcher.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript syntax
        run: node --check static/script.js

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /dev/null
