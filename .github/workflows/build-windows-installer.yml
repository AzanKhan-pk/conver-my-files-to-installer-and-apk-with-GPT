name: Build SaveVido Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - savevido-central-platform
    paths:
      - "app.py"
      - "desktop_launcher.py"
      - "requirements-windows.txt"
      - "templates/**"
      - "static/**"
      - "installer/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; im=Image.open('static/icon-512.png').convert('RGBA'); im.save('static/savevido.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build SaveVido desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SaveVido --icon "static/savevido.ico" --add-data "templates;templates" --add-data "static;static" --collect-all yt_dlp --collect-all gallery_dl --collect-all flask --collect-all werkzeug --collect-all PySide6 --collect-all shiboken6 desktop_launcher.py

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found in the downloaded archive." }
          New-Item -ItemType Directory -Force "dist\SaveVido\ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "dist\SaveVido\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "dist\SaveVido\ffmpeg\ffprobe.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 7\ISCC.exe")) {
              throw "Inno Setup compiler was not installed."
            }
          }

      - name: Prepare branded installer artwork
        shell: pwsh
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; im=Image.open('static/icon-512.png').convert('RGB'); im.resize((55,55), Image.Resampling.LANCZOS).save('installer/savevido-installer-logo.bmp')"

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release" | Out-Null
          $compiler = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files (x86)\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found." }
          & $compiler "installer\SaveVido.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (-not (Test-Path "release\SaveVido-Setup.exe")) { throw "Installer output was not created." }

      - name: Publish versioned GitHub Release and refresh website manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          gh release create $tag "release/SaveVido-Setup.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "SaveVido $version" --notes "SaveVido Windows installer. Requires Windows 10 or Windows 11. Verify compatibility on your PC before relying on it."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }

          $sha256 = (Get-FileHash "release/SaveVido-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          python -c "import json,sys; from datetime import datetime,timezone; p='platform/release-config.json'; d=json.load(open(p,encoding='utf-8')); v=sys.argv[1]; h=sys.argv[2]; d['current_version']=v; d['updated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z'); d['update_service']['status']='Latest Windows release published automatically from GitHub commits.'; w=d['channels']['windows']; w['version']=v; w['status']='Available: latest verified Windows installer.'; w['sha256']=h; json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2); print('Website manifest updated:',v)" $version $sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/release-config.json
          git commit -m "chore: publish SaveVido $version release manifest"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
